  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a0a0a;
      --panel: #141414;
      --line: #2a2a2a;
      --text: #e0e0e0;
      --muted: #888;
      --accent: #7ae5b3;
      --error: #ff9a9a;
      --hdr: 86px;
      --pad: 50px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* ===== 헤더 ===== */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: var(--hdr);
      padding: 0 50px;
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 100;
    }
    .logo {
      font-size: 1.5em;
      font-weight: 300;
      letter-spacing: 2px;
      color: #fff;
      cursor: pointer;
      text-decoration: none;
    }

    .menu-wrap { position: relative; }
    .menu-btn {
      width: 44px;
      height: 44px;
      border: 2px solid var(--line);
      background: transparent;
      color: var(--muted);
      border-radius: 8px;
      cursor: pointer;
      font-size: 1.3em;
      transition: all 0.2s ease;
    }
    .menu-btn:hover { border-color: #555; color: #ccc; }

    .menu-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      min-width: 220px;
      background: var(--panel);
      border: 1px solid #333;
      border-radius: 10px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
      overflow: hidden;
      z-index: 200;
    }
    .menu-dropdown.show { display: block; }

    .menu-item {
      display: block;
      width: 100%;
      padding: 14px 18px;
      background: transparent;
      border: none;
      border-bottom: 1px solid #222;
      color: var(--text);
      text-align: left;
      font-size: 0.95em;
      font-family: inherit;
      text-decoration: none;
      cursor: pointer;
    }
    .menu-item:last-child { border-bottom: none; }
    .menu-item:hover { background: rgba(255, 255, 255, 0.05); }
    .menu-item .sub { display: block; font-size: 0.8em; color: var(--muted); margin-top: 2px; }
    .menu-item.logged-in { color: var(--accent); }

    /* ===== 메인 ===== */
    main { flex: 1; }
    .view { display: none; }
    .view.show { display: block; }

    /* ===== 홈 섹션 ===== */
    .home-video {
      display: block;
      width: 100%;
      height: calc(100dvh - var(--hdr) - 40px);
      object-fit: contain;
      background: #000;
      padding: 20px 0;
    }

    .home-section {
      border-top: 1px solid var(--line);
      background: var(--panel);
    }

    .section-toggle {
      width: 100%;
      padding: 20px var(--pad);
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 1.1em;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.2s ease;
    }

    .section-toggle:hover {
      background: rgba(255, 255, 255, 0.05);
    }

      display: inline-flex;
      align-items: center;
      justify-content: center;
