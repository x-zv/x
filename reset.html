<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>새 비밀번호 설정</title>
</head>
<body>
  <input id="pw" type="password" placeholder="새 비밀번호" />
  <button id="save">변경</button>
  <p id="msg"></p>

  <script>
    const SUPABASE_URL = "https://lhbdijxjnqbzmrvrvrkr.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_e3oKyICzmGvyx1FFcO1dMQ_39veE0G4";

    // 재설정 링크의 #뒤 값에서 access_token을 꺼냅니다.
    const params = new URLSearchParams(location.hash.slice(1));
    const accessToken = params.get("access_token");
    history.replaceState(null, "", location.pathname); // 주소창에서 토큰 제거

    document.getElementById("save").addEventListener("click", async () => {
      const msg = document.getElementById("msg");
      const password = document.getElementById("pw").value;
      if (!accessToken || password.length < 6) {
        msg.textContent = "유효한 링크이거나 6자 이상의 암호인지 확인하세요.";
        return;
      }
      const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
        method: "PUT",
        headers: {
          apikey: SUPABASE_ANON_KEY,
          Authorization: `Bearer ${accessToken}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ password })
      });
      msg.textContent = res.ok ? "비밀번호가 변경되었습니다." : "변경에 실패했습니다. 링크가 만료되었을 수 있습니다.";
    });
  </script>
</body>
</html>
