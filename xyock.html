    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a0a0a;
      --panel: #141414;
      --line: #2a2a2a;
      --text: #e0e0e0;
      --muted: #888;
      --accent: #7ae5b3;
      --error: #ff9a9a;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 50px;
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 100;
    }

    .logo {
      font-size: 1.5em;
      font-weight: 300;
      letter-spacing: 2px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 0.35em;
      line-height: 1;
      cursor: pointer;
    }
    .logo-img {
      display: block;
      width: 52px;
      height: 52px;
      max-width: 52px;
      max-height: 52px;
      flex-shrink: 0;
      object-fit: contain;
    }

    .header-icons {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
      padding-left: 16px;
    }

    .mode-indicator { font-size: 0.8em; color: var(--muted); }
    .mode-indicator.pro { color: #4a9eff; }

    .auth-col {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 6px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border: 2px solid var(--line);
      background: transparent;
      color: var(--muted);
      border-radius: 8px;
      cursor: pointer;
      font-size: 1.05em;
      transition: all 0.2s ease;
    }
    .icon-btn:hover { border-color: #555; color: #ccc; }
    .icon-btn.pro-only {
      display: none;
      border-color: #000;
      color: #000;
      background: #d9d9d9;
      font-weight: bold;
    }
    .icon-btn.pro-only.show { display: inline-block; }

    .login-btn {
      width: auto;
      height: 40px;
      padding: 0 16px;
      border: 2px solid var(--line);
      background: transparent;
      color: var(--muted);
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9em;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    .login-btn:hover { border-color: #555; color: #ccc; }
    .login-btn.logged-in { border-color: var(--accent); color: var(--accent); }

    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 30px 50px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .welcome { text-align: center; padding: 40px 0; }
    .welcome h1 { font-size: 2.4em; font-weight: 300; margin-bottom: 12px; color: #fff; letter-spacing: 1px; }
    .welcome p { font-size: 1.05em; color: var(--muted); }

    .message { display: flex; animation: slideIn 0.25s ease-out; }

      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .message.user { justify-content: flex-end; }
    .message.ai { justify-content: flex-start; }
